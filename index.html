<style>
:root{--blue:#0b63f6;--blue2:#123d9b;--nav:#071a3b;--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#70809a;--line:#e3eaf4;--ok:#16803c;--warn:#9a6500;--danger:#c62838;--shadow:0 12px 32px rgba(21,50,94,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#061633,#0b63f6 55%,#4db4ff)}.login-card{width:min(470px,100%);background:#fff;border-radius:26px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.22)}.logo{display:flex;align-items:center;gap:12px;font-weight:950;font-size:29px;letter-spacing:.02em}.logo-mark{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--blue),#183e9c);display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 8px 20px rgba(11,99,246,.28)}.login h1{margin:24px 0 8px;font-size:27px}.login p{color:var(--muted);line-height:1.55}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#eaf2ff;color:#1550b9}.btn-danger{background:#fff0f2;color:#b42331}.btn-ghost{background:transparent;color:var(--blue)}.login .btn{width:100%;margin-top:9px}.hint{margin-top:18px;padding:13px;border-radius:13px;background:#f5f8ff;color:#5d6c82;font-size:12px;line-height:1.55}.app{display:none;min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--nav);color:#fff;padding:20px 14px;z-index:30;overflow:auto}.brand{padding:4px 10px 25px}.brand .logo{color:#fff}.brand .logo-mark{background:var(--blue)}.nav{display:grid;gap:5px}.nav small{display:block;color:#7e94b8;padding:14px 13px 5px;text-transform:uppercase;letter-spacing:.08em;font-size:10px}.nav button{border:0;background:transparent;color:#cbd7eb;text-align:left;padding:12px 14px;border-radius:10px;font-weight:750}.nav button:hover,.nav button.active{background:#12366f;color:#fff}.main{margin-left:260px;min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.user-chip{display:flex;align-items:center;gap:10px;font-weight:800}.user-area{position:relative}.user-chip-btn{border:0;background:transparent;padding:5px 7px;border-radius:12px;color:var(--text);min-height:44px}.user-chip-btn:hover{background:#f4f7fb;transform:none}.user-chevron{font-size:17px;color:var(--muted);margin-left:1px}.user-menu{position:absolute;right:0;top:calc(100% + 8px);width:190px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 35px rgba(21,50,94,.16);padding:7px;z-index:60}.user-menu button{width:100%;display:flex;align-items:center;gap:9px;border:0;background:#fff;color:var(--text);padding:11px 10px;border-radius:10px;text-align:left;font-weight:750}.user-menu button:hover{background:#f4f7fb}.user-menu .logout-item{color:var(--danger)}.avatar{width:40px;height:40px;border-radius:50%;background:#dceaff;color:#1451bd;display:grid;place-items:center}.content{padding:28px;max-width:1500px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.page-title h2{margin:0 0 4px}.page-title p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:28px;font-weight:950;margin-top:7px}.metric .sub{font-size:12px;color:var(--ok);margin-top:5px}.section{margin-top:20px}.section h3{margin:0 0 13px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{color:#60708a;background:#f8faff}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.badge.ok{background:#eaf8ef;color:#137333}.badge.off{background:#f0f2f5;color:#667085}.badge.warn{background:#fff5df;color:#956300}.badge.blue{background:#eaf2ff;color:#1451bd}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-width:170px}.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.video-card{overflow:hidden;padding:0}.thumb{height:170px;background:linear-gradient(135deg,#071a3b,#0b63f6);display:grid;place-items:center;color:#fff;font-size:46px}.video-body{padding:16px}.video-body h4{margin:8px 0 7px}.video-body p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:4px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:0;background:#fff}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,99,246,.1)}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.modal{display:none;position:fixed;inset:0;background:rgba(2,12,32,.62);z-index:100;place-items:center;padding:18px}.modal.open{display:grid}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modal-head h3{margin:0}.empty{padding:38px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#102344;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:120;box-shadow:var(--shadow)}.mobile-nav{display:none}.exercise-line{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.stat-row{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 12px;background:#f6f8fc;border-radius:11px}.password-wrap{position:relative}.password-wrap input{padding-right:70px}.password-wrap button{position:absolute;right:6px;top:5px;border:0;background:#eef3fb;border-radius:8px;padding:6px 8px;color:#31527f}.notice{padding:13px 15px;border-radius:12px;background:#edf5ff;color:#164d9f;font-size:13px}.danger-note{padding:13px 15px;border-radius:12px;background:#fff2f3;color:#a31d2b;font-size:13px}

<body>
<div id="login" class="login"><div class="login-card"><div class="logo"><div class="logo-mark">🏋️</div><span>ROH FIT</span></div><h1>Seu treino. Sua evolução.</h1><p>Acesso seguro para alunos e administradores.</p><button class="btn btn-primary" onclick="studentLoginModal()">Entrar como aluno</button><button class="btn btn-secondary" onclick="registerModal()">Criar minha conta</button><button class="btn btn-ghost" onclick="adminLoginModal()">Acesso administrativo</button><div class="hint"><b>Aluno:</b> entra com e-mail e senha.<br><b>Novo aluno:</b> cria a conta e define sua senha.<br><b>Administrador:</b> utiliza login e senha próprios.</div></div></div>
<div id="app" class="app"><aside id="sidebar" class="sidebar"></aside><main class="main"><header class="topbar"><strong id="pageName">ROH FIT</strong><div class="user-area"><button class="user-chip user-chip-btn" id="userChipButton" type="button" onclick="toggleUserMenu()" aria-label="Abrir perfil e opções da conta" aria-expanded="false"><div class="avatar" id="avatar">R</div><span id="userName">Usuário</span><span class="user-chevron">⌄</span></button><div id="userMenu" class="user-menu hidden"><button type="button" onclick="openCurrentProfile()">👤 <span>Meu perfil</span></button><button type="button" onclick="logout()" class="logout-item">↪ <span>Sair</span></button></div></div></header><div id="content" class="content"></div></main><nav id="mobileNav" class="mobile-nav"></nav></div>
<div id="modal" class="modal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Cadastro</h3><button class="btn btn-ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='rmfit_system_v4';
const DEFAULT_ADMIN={id:1,name:'Roberta Cardoso',username:'robertam.cardoso',password:'henry2509',role:'Master',status:'Ativo'};
const seed={users:[{id:1,name:'Ana Souza',email:'ana@email.com',role:'Aluno',password:'123456'}],adminUsers:[DEFAULT_ADMIN],students:[{id:1,name:'Ana Souza',email:'ana@email.com',password:'123456',plan:'Premium',status:'Ativo',goal:'Emagrecimento',weight:72.4,height:165,workouts:18}],exercises:[{id:1,name:'Agachamento Livre',muscle:'Pernas',equipment:'Barra',difficulty:'Intermediário',status:'Ativo',execution:'Coluna neutra, joelhos acompanhando os pés.',tips:'Controle a descida e mantenha o abdômen ativo.'},{id:2,name:'Supino Reto',muscle:'Peito',equipment:'Barra',difficulty:'Intermediário',status:'Ativo',execution:'Escápulas estabilizadas e pés firmes.',tips:'Desça a barra com controle.'},{id:3,name:'Puxada Frontal',muscle:'Costas',equipment:'Máquina',difficulty:'Iniciante',status:'Ativo',execution:'Puxe em direção ao peito sem balançar.',tips:'Evite usar impulso.'}],workouts:[{id:1,name:'Treino A — Pernas',student:'Ana Souza',day:'Segunda',exercises:6,status:'Publicado'},{id:2,name:'Treino B — Superior',student:'Ana Souza',day:'Quarta',exercises:5,status:'Publicado'}],videos:[{id:1,title:'Como executar o agachamento',category:'Exercícios',description:'Demonstração completa da execução.',exercise:'Agachamento Livre',duration:'04:20',status:'Ativo',views:32},{id:2,title:'Explicação do Treino A',category:'Treinos',description:'Orientações antes de iniciar o treino.',workout:'Treino A — Pernas',duration:'06:10',status:'Ativo',views:18},{id:3,title:'Alongamento pós-treino',category:'Alongamento',description:'Rotina rápida de mobilidade.',duration:'08:45',status:'Ativo',views:27}],plans:[{id:1,name:'Mensal',value:89.9,period:'Mensal',status:'Ativo'},{id:2,name:'Premium',value:229.9,period:'Trimestral',status:'Ativo'}],payments:[{id:1,student:'Ana Souza',plan:'Premium',value:229.9,status:'Aprovado',date:'15/11/2026'}],notifications:[],support:[],audit:[],settings:{system:'ROH FIT',currency:'BRL',language:'Português (Brasil)',timezone:'America/Sao_Paulo'},session:null};
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){x.adminUsers=x.adminUsers||[DEFAULT_ADMIN];x.users=x.users||[];x.students=x.students||[];x.exercises=x.exercises||[];x.workouts=x.workouts||[];x.videos=x.videos||[];x.plans=x.plans||[];x.payments=x.payments||[];x.notifications=x.notifications||[];x.support=x.support||[];x.audit=x.audit||[];x.settings=x.settings||seed.settings;return x}}catch(e){}return JSON.parse(JSON.stringify(seed))}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(a){return a.length?Math.max(...a.map(x=>Number(x.id)||0))+1:1}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',2300)}
function audit(action,details=''){db.audit.unshift({id:uid(db.audit),user:db.session?.name||'Sistema',action,details,date:new Date().toLocaleString('pt-BR')});save()}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function studentLoginModal(){openModal('Acesso do aluno',`<p style="color:var(--muted)">Entre com seu e-mail e senha.</p><div class="field"><label>E-mail</label><input id="stEmail" type="email" autocomplete="username"></div><div class="field password-wrap"><label>Senha</label><input id="stPass" type="password" autocomplete="current-password"><button onclick="togglePassword('stPass',this)">Mostrar</button></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="studentLogin()">Entrar</button></div>`)}
function studentLogin(){const email=document.getElementById('stEmail').value.trim().toLowerCase(),password=document.getElementById('stPass').value;const u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===password&&x.role==='Aluno');const s=db.students.find(x=>x.email.toLowerCase()===email);if(!u||!s||s.status!=='Ativo')return alert('E-mail, senha inválidos ou aluno não está ativo.');db.session={type:'student',id:s.id,name:s.name,email:s.email};audit('Login de aluno',s.name);closeModal();start()}
function adminLoginModal(){openModal('Acesso administrativo',`<p style="color:var(--muted)">Entre com seu usuário administrativo.</p><div class="field"><label>Usuário</label><input id="aUser" value="robertam.cardoso" autocomplete="username"></div><div class="field password-wrap"><label>Senha</label><input id="aPass" type="password" autocomplete="current-password"><button onclick="togglePassword('aPass',this)">Mostrar</button></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="adminLogin()">Entrar</button></div>`)}
function togglePassword(id,b){const x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'Mostrar':'Ocultar'}
function adminLogin(){const u=document.getElementById('aUser').value.trim().toLowerCase(),p=document.getElementById('aPass').value;const a=db.adminUsers.find(x=>x.username.toLowerCase()===u&&x.password===p&&x.status==='Ativo');if(!a)return alert('Usuário ou senha inválidos.');db.session={type:'admin',id:a.id,name:a.name,role:a.role,username:a.username};audit('Login administrativo','Acesso realizado');closeModal();start()}
function registerModal(){openModal('Criar minha conta',`<p style="color:var(--muted)">Crie sua conta e defina uma senha com pelo menos 6 caracteres. Após o cadastro, o acesso será iniciado automaticamente.</p><div class="form-grid"><div class="field full"><label>Nome completo</label><input id="rName"></div><div class="field"><label>Data de nascimento</label><input id="rBirth" type="date"></div><div class="field"><label>CPF</label><input id="rCpf" placeholder="000.000.000-00"></div><div class="field"><label>E-mail</label><input id="rEmail" type="email"></div><div class="field password-wrap"><label>Senha</label><input id="rPassword" type="password" autocomplete="new-password"><button onclick="togglePassword('rPassword',this)">Mostrar</button></div><div class="field password-wrap"><label>Confirmar senha</label><input id="rPassword2" type="password" autocomplete="new-password"><button onclick="togglePassword('rPassword2',this)">Mostrar</button></div><div class="field"><label>WhatsApp / Telefone</label><input id="rPhone"></div><div class="field"><label>Objetivo</label><select id="rGoal"><option>Emagrecimento</option><option>Perda de gordura</option><option>Ganho de massa muscular</option><option>Força</option><option>Condicionamento</option><option>Manutenção</option><option>Outro</option></select></div><div class="field"><label>Altura (cm)</label><input id="rHeight" type="number"></div><div class="field"><label>Peso atual (kg)</label><input id="rWeight" type="number" step="0.1"></div><div class="field full"><label><input id="rTerms" type="checkbox" style="width:auto;margin-right:7px">Aceito os Termos de Uso e a Política de Privacidade.</label></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createAccount()">Criar conta e entrar</button></div>`)}
function createAccount(){const name=document.getElementById('rName').value.trim(),email=document.getElementById('rEmail').value.trim().toLowerCase(),password=document.getElementById('rPassword').value,confirm=document.getElementById('rPassword2').value,terms=document.getElementById('rTerms').checked;if(!name||!email||!password)return alert('Preencha nome, e-mail e senha.');if(password.length<6)return alert('A senha deve ter pelo menos 6 caracteres.');if(password!==confirm)return alert('As senhas não conferem.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Informe um e-mail válido.');if(!terms)return alert('Aceite os Termos de Uso e a Política de Privacidade.');if(db.users.some(x=>x.email.toLowerCase()===email))return alert('Este e-mail já está cadastrado.');const id=uid(db.users);const s={id,name,email,password,birth:document.getElementById('rBirth').value,cpf:document.getElementById('rCpf').value.trim(),phone:document.getElementById('rPhone').value.trim(),goal:document.getElementById('rGoal').value,height:Number(document.getElementById('rHeight').value)||null,weight:Number(document.getElementById('rWeight').value)||null,plan:'Ainda não definido',status:'Ativo',workouts:0};db.users.push({id,name,email,password,role:'Aluno'});db.students.push(s);db.session={type:'student',id,name,email};audit('Cadastro de aluno',name);closeModal();start()}
function demoStudent(){const s=db.students[0]||{id:1,name:'Aluno Demo',email:'aluno@rmfit.com'};db.session={type:'student',id:s.id,name:s.name,email:s.email};save();start()}
function start(){save();document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userName').textContent=db.session.name;document.getElementById('avatar').textContent=(db.session.name||'U')[0].toUpperCase();renderNavigation();closeUserMenu();showPage(db.session.type==='student'?'perfil':'dashboard');window.scrollTo(0,0)}
function logout(){db.session=null;save();closeUserMenu();closeModal();document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('content').innerHTML='';document.getElementById('pageName').textContent='ROH FIT';window.scrollTo(0,0)}
function toggleUserMenu(){const m=document.getElementById('userMenu'),b=document.getElementById('userChipButton');if(!m)return;const willOpen=m.classList.contains('hidden');m.classList.toggle('hidden',!willOpen);if(b)b.setAttribute('aria-expanded',willOpen?'true':'false')}
function closeUserMenu(){const m=document.getElementById('userMenu'),b=document.getElementById('userChipButton');if(m)m.classList.add('hidden');if(b)b.setAttribute('aria-expanded','false')}
function openCurrentProfile(){closeUserMenu();if(db.session.type==='student'){showPage('perfil');return;}openModal('Meu perfil administrativo',`<div class="form-grid"><div class="field full"><label>Nome</label><input value="${esc(db.session.name||'')}" readonly></div><div class="field"><label>Usuário</label><input value="${esc(db.session.username||'')}" readonly></div><div class="field"><label>Função</label><input value="${esc(db.session.role||'Administrador')}" readonly></div><div class="field full"><label>Status</label><input value="Ativo" readonly></div></div><div class="actions"><button class="btn btn-secondary" onclick="changePasswordModal(db.session.id)">Alterar senha</button><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>`)}
document.addEventListener('click',function(e){const area=document.querySelector('.user-area');if(area&&!area.contains(e.target))closeUserMenu()})
const adminMenus=[['Principal','📊','dashboard','Dashboard'],['Alunos','👥','students','Alunos'],['Treinos','🏋️','workouts','Treinos'],['Exercícios','💪','exercises','Exercícios'],['Vídeos','🎬','videos','Vídeos'],['Planos','💳','plans','Planos'],['Financeiro','💰','payments','Pagamentos / Financeiro'],['Evolução','📈','evolution','Evolução'],['Comunicação','🔔','notifications','Notificações'],['Suporte','🛟','support','Suporte'],['Relatórios','📊','reports','Relatórios'],['Administradores','🛡️','admins','Administradores'],['Segurança','🔐','security','Segurança / Auditoria'],['Sistema','⚙️','settings','Configurações']];
const studentMenus=[['Aluno','👤','perfil','Perfil'],['Aluno','🎯','objetivo','Objetivo'],['Aluno','🏋️','studentWorkouts','Treinos'],['Aluno','📈','studentEvolution','Evolução'],['Aluno','🕘','history','Histórico'],['Aluno','📋','plan','Plano'],['Aluno','💳','studentPayments','Pagamentos']];
function renderNavigation(){const isA=db.session.type==='admin';const menus=isA?adminMenus:studentMenus;document.getElementById('sidebar').innerHTML=`<div class="brand"><div class="logo"><div class="logo-mark">🏋️</div><span>ROH FIT</span></div></div><nav class="nav">${menus.map((m,i)=>`${(i===0||m[0]!==menus[i-1][0])?`<small>${m[0]}</small>`:''}<button data-page="${m[2]}" onclick="showPage('${m[2]}')">${m[1]} <span>${m[3]}</span></button>`).join('')}<small>Conta</small><button onclick="logout()">🚪 <span>Sair</span></button></nav>`;const mobile=(isA?adminMenus.slice(0,4):studentMenus.slice(0,4));document.getElementById('mobileNav').innerHTML=mobile.map(m=>`<button data-page="${m[2]}" onclick="showPage('${m[2]}')">${m[1]}<br>${m[3]}</button>`).join('')}
const titles={dashboard:'Dashboard',students:'Alunos',workouts:'Treinos',exercises:'Exercícios',videos:'Vídeos',plans:'Planos',payments:'Pagamentos / Financeiro',evolution:'Evolução',notifications:'Notificações',support:'Suporte',reports:'Relatórios',admins:'Administradores',security:'Segurança / Auditoria',settings:'Configurações',perfil:'Perfil',objetivo:'Objetivo',studentWorkouts:'Treinos',studentEvolution:'Evolução',history:'Histórico',plan:'Plano',studentPayments:'Pagamentos'};
function showPage(page){if(db.session.type==='student'&&!studentMenus.some(x=>x[2]===page))return;document.querySelectorAll('.nav button[data-page],.mobile-nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageName').textContent=titles[page]||'ROH FIT';const views={dashboard,students,workouts,exercises,videos,plans,payments,evolution,notifications,support,reports,admins,security,settings,perfil,objetivo,studentWorkouts,studentEvolution,history,plan,studentPayments};document.getElementById('content').innerHTML=views[page]?views[page]():''}
function dashboard(){return `<div class="page-title"><div><h2>Visão geral do ROH FIT</h2><p>Controle operacional, alunos, treinos e resultados.</p></div></div><div class="grid"><div class="card metric"><div class="label">Alunos ativos</div><div class="value">${db.students.filter(s=>s.status==='Ativo').length}</div><div class="sub">Base atual</div></div><div class="card metric"><div class="label">Treinos publicados</div><div class="value">${db.workouts.filter(w=>w.status==='Publicado').length}</div></div><div class="card metric"><div class="label">Vídeos ativos</div><div class="value">${db.videos.filter(v=>v.status==='Ativo').length}</div></div><div class="card metric"><div class="label">Receita registrada</div><div class="value">R$ ${db.payments.reduce((a,p)=>a+(Number(p.value)||0),0).toFixed(2).replace('.',',')}</div></div></div><div class="section grid-3"><div class="card"><h3>Acesso rápido</h3><button class="btn btn-primary" onclick="showPage('students')">Gerenciar alunos</button> <button class="btn btn-secondary" onclick="showPage('workouts')">Gerenciar treinos</button></div><div class="card"><h3>Vídeos</h3><p style="color:var(--muted)">Exercícios, treinos, educativos, alongamento, aquecimento, dicas e motivacional.</p><button class="btn btn-secondary" onclick="showPage('videos')">Abrir vídeos</button></div><div class="card"><h3>Segurança</h3><p style="color:var(--muted)">Controle de acesso, troca de senha e auditoria.</p><button class="btn btn-secondary" onclick="showPage('security')">Abrir segurança</button></div></div>`}
function students(){return `<div class="page-title"><div><h2>Alunos</h2><p>Cadastro, dados físicos, objetivos, treinos, evolução e pagamentos.</p></div><button class="btn btn-primary" onclick="studentModal()">+ Novo aluno</button></div><div class="filters"><input placeholder="Pesquisar aluno..." oninput="filterTable(this.value,'studentRows')"><select onchange="filterStatus(this.value,'studentRows')"><option value="">Todos os status</option><option>Ativo</option><option>Inativo</option><option>Bloqueado</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Aluno</th><th>E-mail</th><th>Objetivo</th><th>Plano</th><th>Status</th><th>Ações</th></tr></thead><tbody id="studentRows">${db.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.email)}</td><td>${esc(s.goal||'—')}</td><td>${esc(s.plan||'—')}</td><td><span class="badge ${s.status==='Ativo'?'ok':s.status==='Bloqueado'?'warn':'off'}">${esc(s.status)}</span></td><td><button class="btn btn-secondary" onclick="studentModal(${s.id})">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function studentModal(id){const s=db.students.find(x=>x.id===id)||{};openModal(id?'Editar aluno':'Novo aluno',`<div class="form-grid"><div class="field full"><label>Nome</label><input id="sName" value="${esc(s.name)}"></div><div class="field"><label>E-mail</label><input id="sEmail" value="${esc(s.email)}"></div><div class="field"><label>Telefone</label><input id="sPhone" value="${esc(s.phone)}"></div><div class="field"><label>Objetivo</label><input id="sGoal" value="${esc(s.goal)}"></div><div class="field"><label>Plano</label><select id="sPlan">${db.plans.map(p=>`<option ${p.name===s.plan?'selected':''}>${esc(p.name)}</option>`).join('')}<option ${!s.plan||s.plan==='Ainda não definido'?'selected':''}>Ainda não definido</option></select></div><div class="field"><label>Peso (kg)</label><input id="sWeight" type="number" step="0.1" value="${s.weight||''}"></div><div class="field"><label>Altura (cm)</label><input id="sHeight" type="number" value="${s.height||''}"></div><div class="field"><label>Status</label><select id="sStatus"><option ${s.status==='Ativo'?'selected':''}>Ativo</option><option ${s.status==='Inativo'?'selected':''}>Inativo</option><option ${s.status==='Bloqueado'?'selected':''}>Bloqueado</option></select></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveStudent(${id||0})">Salvar</button></div>`)}
function saveStudent(id){const o={id:id||uid(db.students),name:document.getElementById('sName').value.trim(),email:document.getElementById('sEmail').value.trim(),phone:document.getElementById('sPhone').value.trim(),goal:document.getElementById('sGoal').value.trim(),plan:document.getElementById('sPlan').value,weight:Number(document.getElementById('sWeight').value)||null,height:Number(document.getElementById('sHeight').value)||null,status:document.getElementById('sStatus').value,workouts:id?(db.students.find(x=>x.id===id)?.workouts||0):0};if(!o.name||!o.email)return alert('Nome e e-mail são obrigatórios.');if(id)db.students=db.students.map(x=>x.id===id?{...x,...o}:x);else db.students.push(o);save();audit(id?'Atualização de aluno':'Cadastro de aluno',o.name);closeModal();showPage('students');toast('Aluno salvo')}
function workouts(){return `<div class="page-title"><div><h2>Treinos</h2><p>Criação, montagem, prescrição, publicação e atribuição.</p></div><button class="btn btn-primary" onclick="workoutModal()">+ Novo treino</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Treino</th><th>Aluno</th><th>Dia</th><th>Exercícios</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.workouts.map(w=>`<tr><td><b>${esc(w.name)}</b></td><td>${esc(w.student)}</td><td>${esc(w.day)}</td><td>${w.exercises}</td><td><span class="badge blue">${esc(w.status)}</span></td><td><button class="btn btn-secondary" onclick="workoutModal(${w.id})">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function workoutModal(id){const w=db.workouts.find(x=>x.id===id)||{};openModal(id?'Editar treino':'Novo treino',`<div class="form-grid"><div class="field full"><label>Nome</label><input id="wName" value="${esc(w.name)}"></div><div class="field"><label>Aluno</label><select id="wStudent">${db.students.map(s=>`<option ${s.name===w.student?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Dia</label><select id="wDay">${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'].map(d=>`<option ${d===w.day?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Exercícios</label><input id="wEx" type="number" min="1" value="${w.exercises||1}"></div><div class="field"><label>Status</label><select id="wStatus"><option ${w.status==='Publicado'?'selected':''}>Publicado</option><option ${w.status==='Rascunho'?'selected':''}>Rascunho</option><option ${w.status==='Arquivado'?'selected':''}>Arquivado</option></select></div></div><div class="notice">A estrutura completa de séries, repetições, carga, descanso e ordem dos exercícios será vinculada ao banco de dados do ROH FIT.</div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveWorkout(${id||0})">Salvar treino</button></div>`)}
function saveWorkout(id){const o={id:id||uid(db.workouts),name:document.getElementById('wName').value.trim(),student:document.getElementById('wStudent').value,day:document.getElementById('wDay').value,exercises:Number(document.getElementById('wEx').value)||1,status:document.getElementById('wStatus').value};if(id)db.workouts=db.workouts.map(x=>x.id===id?o:x);else db.workouts.push(o);save();audit(id?'Atualização de treino':'Cadastro de treino',o.name);closeModal();showPage('workouts');toast('Treino salvo')}
function exercises(){return `<div class="page-title"><div><h2>Exercícios</h2><p>Biblioteca técnica do ROH FIT.</p></div><button class="btn btn-primary" onclick="exerciseModal()">+ Novo exercício</button></div><div class="filters"><input placeholder="Pesquisar exercício..." oninput="filterTable(this.value,'exerciseRows')"><select onchange="filterTable(this.value,'exerciseRows')"><option value="">Todos</option><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Músculo</th><th>Equipamento</th><th>Dificuldade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="exerciseRows">${db.exercises.map(e=>`<tr><td><b>${esc(e.name)}</b></td><td>${esc(e.muscle)}</td><td>${esc(e.equipment)}</td><td>${esc(e.difficulty)}</td><td><span class="badge ok">${esc(e.status)}</span></td><td><button class="btn btn-secondary" onclick="exerciseModal(${e.id})">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function exerciseModal(id){const e=db.exercises.find(x=>x.id===id)||{};openModal(id?'Editar exercício':'Novo exercício',`<div class="form-grid"><div class="field"><label>Nome</label><input id="eName" value="${esc(e.name)}"></div><div class="field"><label>Grupo muscular</label><input id="eMuscle" value="${esc(e.muscle)}"></div><div class="field"><label>Equipamento</label><input id="eEquip" value="${esc(e.equipment)}"></div><div class="field"><label>Dificuldade</label><select id="eDiff">${['Iniciante','Intermediário','Avançado'].map(d=>`<option ${d===e.difficulty?'selected':''}>${d}</option>`).join('')}</select></div><div class="field full"><label>Execução</label><textarea id="eExec">${esc(e.execution)}</textarea></div><div class="field full"><label>Dicas</label><textarea id="eTips">${esc(e.tips)}</textarea></div><div class="field"><label>Foto</label><input type="file" accept="image/*"></div><div class="field"><label>Vídeo</label><input type="file" accept="video/*"></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveExercise(${id||0})">Salvar</button></div>`)}
function saveExercise(id){const o={id:id||uid(db.exercises),name:document.getElementById('eName').value.trim(),muscle:document.getElementById('eMuscle').value.trim(),equipment:document.getElementById('eEquip').value.trim(),difficulty:document.getElementById('eDiff').value,status:'Ativo',execution:document.getElementById('eExec').value,tips:document.getElementById('eTips').value};if(!o.name)return alert('Informe o nome.');if(id)db.exercises=db.exercises.map(x=>x.id===id?{...x,...o}:x);else db.exercises.push(o);save();audit(id?'Atualização de exercício':'Cadastro de exercício',o.name);closeModal();showPage('exercises');toast('Exercício salvo')}
function videos(){const cats=['Exercícios','Treinos','Educativos','Alongamento','Aquecimento','Dicas','Motivacional'];return `<div class="page-title"><div><h2>Vídeos</h2><p>Biblioteca de vídeos do ROH FIT.</p></div><button class="btn btn-primary" onclick="videoModal()">+ Adicionar vídeo</button></div><div class="filters"><input placeholder="Pesquisar vídeo..." oninput="filterCards(this.value)"><select id="videoCatFilter" onchange="filterCards()"><option value="">Todas as categorias</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select><select id="videoStatusFilter" onchange="filterCards()"><option value="">Todos os status</option><option>Ativo</option><option>Inativo</option></select></div><div id="videoGrid" class="video-grid">${db.videos.map(v=>`<div class="card video-card" data-search="${esc((v.title+' '+v.category+' '+v.description).toLowerCase())}" data-cat="${esc(v.category)}" data-status="${esc(v.status)}"><div class="thumb">▶</div><div class="video-body"><span class="badge blue">${esc(v.category)}</span><h4>${esc(v.title)}</h4><p>${esc(v.description||'')}</p><div class="stat-row"><span class="stat">⏱ ${esc(v.duration||'--:--')}</span><span class="stat">👁 ${v.views||0}</span></div><div class="actions" style="justify-content:flex-start"><button class="btn btn-primary" onclick="playVideo(${v.id})">Assistir</button><button class="btn btn-secondary" onclick="videoModal(${v.id})">Editar</button></div></div></div>`).join('')}</div>`}
function filterCards(q=''){q=(q||document.querySelector('.filters input')?.value||'').toLowerCase();const cat=document.getElementById('videoCatFilter')?.value||'',st=document.getElementById('videoStatusFilter')?.value||'';document.querySelectorAll('#videoGrid .video-card').forEach(c=>c.style.display=(!q||c.dataset.search.includes(q))&&(!cat||c.dataset.cat===cat)&&(!st||c.dataset.status===st)?'':'none')}
function videoModal(id){const v=db.videos.find(x=>x.id===id)||{};const cats=['Exercícios','Treinos','Educativos','Alongamento','Aquecimento','Dicas','Motivacional'];openModal(id?'Editar vídeo':'Adicionar vídeo',`<div class="form-grid"><div class="field full"><label>Título</label><input id="vTitle" value="${esc(v.title)}"></div><div class="field"><label>Categoria</label><select id="vCat">${cats.map(c=>`<option ${c===v.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Duração</label><input id="vDuration" value="${esc(v.duration)}" placeholder="05:30"></div><div class="field full"><label>Descrição</label><textarea id="vDesc">${esc(v.description)}</textarea></div><div class="field"><label>Arquivo do vídeo</label><input id="vFile" type="file" accept="video/*"></div><div class="field"><label>Thumbnail / capa</label><input id="vThumb" type="file" accept="image/*"></div><div class="field"><label>Exercício associado</label><select id="vExercise"><option value="">Nenhum</option>${db.exercises.map(e=>`<option ${e.name===v.exercise?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Treino associado</label><select id="vWorkout"><option value="">Nenhum</option>${db.workouts.map(w=>`<option ${w.name===v.workout?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="vStatus"><option ${v.status==='Ativo'?'selected':''}>Ativo</option><option ${v.status==='Inativo'?'selected':''}>Inativo</option></select></div></div><div class="notice">No protótipo, os campos de arquivo ficam preparados. O armazenamento real de vídeo/imagem será conectado ao backend.</div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveVideo(${id||0})">Salvar vídeo</button></div>`)}
function saveVideo(id){const title=document.getElementById('vTitle').value.trim();if(!title)return alert('Informe o título.');const old=id?db.videos.find(v=>v.id===id):{};const o={id:id||uid(db.videos),title,category:document.getElementById('vCat').value,description:document.getElementById('vDesc').value,duration:document.getElementById('vDuration').value||'--:--',exercise:document.getElementById('vExercise').value,workout:document.getElementById('vWorkout').value,status:document.getElementById('vStatus').value,views:old?.views||0};if(id)db.videos=db.videos.map(v=>v.id===id?{...v,...o}:v);else db.videos.push(o);save();audit(id?'Atualização de vídeo':'Cadastro de vídeo',title);closeModal();showPage('videos');toast('Vídeo salvo')}
function playVideo(id){const v=db.videos.find(x=>x.id===id);if(v)v.views=(v.views||0)+1;save();openModal(v.title,`<div style="height:320px;background:#061a3c;border-radius:15px;display:grid;place-items:center;color:white;font-size:64px">▶</div><div style="margin-top:14px"><span class="badge blue">${esc(v.category)}</span><p><b>Duração:</b> ${esc(v.duration)}<br><b>Descrição:</b> ${esc(v.description||'')}</p></div><div class="actions"><button class="btn btn-primary" onclick="closeModal()">Fechar</button></div>`)}
function plans(){return `<div class="page-title"><div><h2>Planos</h2><p>Planos, preços, benefícios e assinaturas.</p></div><button class="btn btn-primary" onclick="planModal()">+ Novo plano</button></div><div class="grid-3">${db.plans.map(p=>`<div class="card"><span class="badge ok">${esc(p.status)}</span><h3>${esc(p.name)}</h3><div class="metric"><div class="value">R$ ${Number(p.value).toFixed(2).replace('.',',')}</div></div><p style="color:var(--muted)">${esc(p.period)}</p><button class="btn btn-secondary" onclick="planModal(${p.id})">Editar</button></div>`).join('')}</div>`}
function planModal(id){const p=db.plans.find(x=>x.id===id)||{};openModal(id?'Editar plano':'Novo plano',`<div class="form-grid"><div class="field"><label>Nome</label><input id="pName" value="${esc(p.name)}"></div><div class="field"><label>Valor</label><input id="pValue" type="number" step="0.01" value="${p.value||''}"></div><div class="field"><label>Periodicidade</label><select id="pPeriod">${['Mensal','Trimestral','Semestral','Anual'].map(x=>`<option ${x===p.period?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="pStatus"><option ${p.status!=='Inativo'?'selected':''}>Ativo</option><option ${p.status==='Inativo'?'selected':''}>Inativo</option></select></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePlan(${id||0})">Salvar</button></div>`)}
function savePlan(id){const o={id:id||uid(db.plans),name:document.getElementById('pName').value.trim(),value:Number(document.getElementById('pValue').value)||0,period:document.getElementById('pPeriod').value,status:document.getElementById('pStatus').value};if(id)db.plans=db.plans.map(x=>x.id===id?o:x);else db.plans.push(o);save();audit(id?'Atualização de plano':'Cadastro de plano',o.name);closeModal();showPage('plans');toast('Plano salvo')}
function payments(){return `<div class="page-title"><div><h2>Pagamentos / Financeiro</h2><p>Controle financeiro completo do sistema.</p></div></div><div class="grid"><div class="card metric"><div class="label">Receita</div><div class="value">R$ ${db.payments.reduce((a,p)=>a+Number(p.value||0),0).toFixed(2).replace('.',',')}</div></div><div class="card metric"><div class="label">Aprovados</div><div class="value">${db.payments.filter(p=>p.status==='Aprovado').length}</div></div><div class="card metric"><div class="label">Pendentes</div><div class="value">${db.payments.filter(p=>p.status==='Pendente').length}</div></div><div class="card metric"><div class="label">Cancelados / estornos</div><div class="value">${db.payments.filter(p=>p.status==='Cancelado'||p.status==='Estornado').length}</div></div></div><div class="section table-wrap"><table class="table"><thead><tr><th>Aluno</th><th>Plano</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody>${db.payments.map(p=>`<tr><td>${esc(p.student)}</td><td>${esc(p.plan)}</td><td>R$ ${Number(p.value).toFixed(2).replace('.',',')}</td><td><span class="badge ${p.status==='Aprovado'?'ok':p.status==='Pendente'?'warn':'off'}">${esc(p.status)}</span></td><td>${esc(p.date)}</td></tr>`).join('')}</tbody></table></div>`}
function evolution(){return `<div class="page-title"><div><h2>Evolução dos alunos</h2><p>Peso, medidas, fotos, cargas, repetições e frequência.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Aluno</th><th>Peso atual</th><th>Objetivo</th><th>Treinos</th><th>Frequência</th><th>Ação</th></tr></thead><tbody>${db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.weight?s.weight+' kg':'—'}</td><td>${esc(s.goal||'—')}</td><td>${s.workouts||0}</td><td>—</td><td><button class="btn btn-secondary" onclick="toast('Painel detalhado de evolução preparado para o backend')">Ver evolução</button></td></tr>`).join('')}</tbody></table></div>`}
function notifications(){return `<div class="page-title"><div><h2>Notificações</h2><p>Envio para um aluno, grupos ou todos.</p></div><button class="btn btn-primary" onclick="notificationModal()">+ Nova notificação</button></div><div class="card">${db.notifications.length?db.notifications.map(n=>`<div class="exercise-line"><div><b>${esc(n.title)}</b><div style="color:var(--muted)">${esc(n.message)}</div></div><span class="badge blue">${esc(n.target||'Todos')}</span></div>`).join(''):'<div class="empty">Nenhuma notificação cadastrada.</div>'}</div>`}
function notificationModal(){openModal('Nova notificação',`<div class="form-grid"><div class="field"><label>Título</label><input id="nTitle"></div><div class="field"><label>Destino</label><select id="nTarget"><option>Todos</option>${db.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><label>Mensagem</label><textarea id="nMsg"></textarea></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveNotification()">Enviar</button></div>`)}
function saveNotification(){const n={id:uid(db.notifications),title:document.getElementById('nTitle').value.trim(),message:document.getElementById('nMsg').value.trim(),target:document.getElementById('nTarget').value,date:new Date().toLocaleString('pt-BR')};if(!n.title||!n.message)return alert('Preencha título e mensagem.');db.notifications.unshift(n);save();audit('Envio de notificação',n.title);closeModal();showPage('notifications');toast('Notificação criada')}
function support(){return `<div class="page-title"><div><h2>Suporte</h2><p>Tickets, mensagens, problemas, respostas e histórico.</p></div></div><div class="card"><div class="empty">Nenhum chamado pendente no protótipo.</div></div>`}
function reports(){return `<div class="page-title"><div><h2>Relatórios</h2><p>Relatórios operacionais, de evolução e financeiros.</p></div><button class="btn btn-secondary" onclick="toast('Exportação será conectada ao backend')">Exportar</button></div><div class="grid"><div class="card metric"><div class="label">Alunos</div><div class="value">${db.students.length}</div></div><div class="card metric"><div class="label">Exercícios</div><div class="value">${db.exercises.length}</div></div><div class="card metric"><div class="label">Vídeos</div><div class="value">${db.videos.length}</div></div><div class="card metric"><div class="label">Planos</div><div class="value">${db.plans.length}</div></div></div>`}
function admins(){return `<div class="page-title"><div><h2>Administradores</h2><p>Usuários administrativos e controle de acesso.</p></div><button class="btn btn-primary" onclick="adminModal()">+ Novo administrador</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead><tbody>${db.adminUsers.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.username)}</td><td>${esc(a.role)}</td><td><span class="badge ok">${esc(a.status)}</span></td><td><button class="btn btn-secondary" onclick="changePasswordModal(${a.id})">Alterar senha</button></td></tr>`).join('')}</tbody></table></div>`}
function adminModal(){openModal('Novo administrador',`<div class="form-grid"><div class="field"><label>Nome</label><input id="adName"></div><div class="field"><label>Usuário</label><input id="adUser"></div><div class="field"><label>Senha inicial</label><input id="adPass" type="password"></div><div class="field"><label>Perfil</label><select id="adRole"><option>Master</option><option>Admin</option><option>Trainer</option><option>Finance</option><option>Support</option></select></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAdmin()">Criar</button></div>`)}
function saveAdmin(){const name=document.getElementById('adName').value.trim(),username=document.getElementById('adUser').value.trim().toLowerCase(),password=document.getElementById('adPass').value;if(!name||!username||!password)return alert('Preencha todos os campos.');if(db.adminUsers.some(a=>a.username===username))return alert('Usuário já existe.');db.adminUsers.push({id:uid(db.adminUsers),name,username,password,role:document.getElementById('adRole').value,status:'Ativo'});save();audit('Cadastro de administrador',username);closeModal();showPage('admins');toast('Administrador criado')}
function changePasswordModal(id){const a=db.adminUsers.find(x=>x.id===id);if(!a)return;openModal('Alterar senha',`<p style="color:var(--muted)">Usuário: <b>${esc(a.username)}</b></p><div class="field password-wrap"><label>Senha atual</label><input id="cpOld" type="password"><button onclick="togglePassword('cpOld',this)">Mostrar</button></div><div class="field password-wrap"><label>Nova senha</label><input id="cpNew" type="password"><button onclick="togglePassword('cpNew',this)">Mostrar</button></div><div class="field password-wrap"><label>Confirmar nova senha</label><input id="cpNew2" type="password"><button onclick="togglePassword('cpNew2',this)">Mostrar</button></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="changePassword(${id})">Salvar nova senha</button></div>`)}
function changePassword(id){const a=db.adminUsers.find(x=>x.id===id);const old=document.getElementById('cpOld').value,n=document.getElementById('cpNew').value,n2=document.getElementById('cpNew2').value;if(old!==a.password)return alert('A senha atual está incorreta.');if(!n||n.length<6)return alert('A nova senha deve ter pelo menos 6 caracteres.');if(n===old)return alert('A nova senha deve ser diferente da atual.');if(n!==n2)return alert('As novas senhas não conferem.');a.password=n;save();audit('Alteração de senha','Usuário '+a.username);closeModal();toast('Senha alterada com sucesso')}
function security(){return `<div class="page-title"><div><h2>Segurança / Auditoria</h2><p>Controle de acesso e registro de ações administrativas.</p></div></div><div class="card"><div class="danger-note"><b>Protótipo:</b> as credenciais estão no armazenamento local. Em produção, a senha deverá ser armazenada como hash no backend, com sessões seguras e HTTPS.</div></div><div class="section table-wrap"><table class="table"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead><tbody>${db.audit.slice(0,100).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`}
function settings(){return `<div class="page-title"><div><h2>Configurações</h2><p>Dados do sistema, identidade visual, idioma, moeda, notificações e integrações.</p></div></div><div class="card"><div class="form-grid"><div class="field"><label>Nome do sistema</label><input id="setSystem" value="${esc(db.settings.system)}"></div><div class="field"><label>Moeda</label><select id="setCurrency"><option>BRL</option><option>EUR</option><option>USD</option></select></div><div class="field"><label>Idioma</label><select id="setLang"><option>Português (Brasil)</option><option>Español</option><option>English</option></select></div><div class="field"><label>Fuso horário</label><select id="setTZ"><option>America/Sao_Paulo</option></select></div><div class="field full"><label>Logo</label><input type="file" accept="image/*"></div><div class="field full"><label>Ícone do aplicativo</label><input type="file" accept="image/*"></div></div><div class="actions"><button class="btn btn-primary" onclick="saveSettings()">Salvar alterações</button><button class="btn btn-secondary" onclick="changePasswordModal(${db.session.id})">Alterar minha senha</button></div></div>`}
function saveSettings(){db.settings.system=document.getElementById('setSystem').value;db.settings.currency=document.getElementById('setCurrency').value;db.settings.language=document.getElementById('setLang').value;db.settings.timezone=document.getElementById('setTZ').value;save();audit('Alteração de configurações','Sistema');toast('Configurações salvas')}
function perfil(){const s=db.students.find(x=>x.id===db.session.id)||db.students.find(x=>x.email===db.session.email)||{};return `<div class="page-title"><div><h2>Meu perfil</h2><p>Consulte e edite seus dados pessoais.</p></div><div><button class="btn btn-primary" onclick="editStudentProfile()">Editar perfil</button> <button class="btn btn-secondary" onclick="studentChangePasswordModal()">Alterar senha</button></div></div><div class="card"><div class="form-grid"><div class="field full"><label>Nome</label><input value="${esc(s.name||db.session.name)}" readonly></div><div class="field"><label>E-mail</label><input value="${esc(s.email||db.session.email)}" readonly></div><div class="field"><label>Telefone</label><input value="${esc(s.phone||'')}" readonly></div><div class="field"><label>Data de nascimento</label><input value="${esc(s.birth||'')}" readonly></div><div class="field"><label>CPF</label><input value="${esc(s.cpf||'')}" readonly></div><div class="field"><label>Altura</label><input value="${s.height?s.height+' cm':''}" readonly></div><div class="field"><label>Peso</label><input value="${s.weight?s.weight+' kg':''}" readonly></div></div></div>`}

function editStudentProfile(){const s=db.students.find(x=>x.id===db.session.id);if(!s)return;openModal('Editar meu perfil',`<div class="form-grid"><div class="field full"><label>Nome completo</label><input id="epName" value="${esc(s.name||'')}"></div><div class="field"><label>E-mail</label><input id="epEmail" type="email" value="${esc(s.email||'')}"></div><div class="field"><label>Telefone / WhatsApp</label><input id="epPhone" value="${esc(s.phone||'')}"></div><div class="field"><label>Data de nascimento</label><input id="epBirth" type="date" value="${esc(s.birth||'')}"></div><div class="field"><label>CPF</label><input id="epCpf" value="${esc(s.cpf||'')}"></div><div class="field"><label>Altura (cm)</label><input id="epHeight" type="number" value="${s.height||''}"></div><div class="field"><label>Peso (kg)</label><input id="epWeight" type="number" step="0.1" value="${s.weight||''}"></div></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveStudentProfile()">Salvar alterações</button></div>`)}
function saveStudentProfile(){const s=db.students.find(x=>x.id===db.session.id);if(!s)return;const email=document.getElementById('epEmail').value.trim().toLowerCase(),name=document.getElementById('epName').value.trim();if(!name||!email)return alert('Nome e e-mail são obrigatórios.');if(db.users.some(u=>u.email.toLowerCase()===email&&u.id!==s.id))return alert('Este e-mail já está em uso.');const oldEmail=s.email;s.name=name;s.email=email;s.phone=document.getElementById('epPhone').value.trim();s.birth=document.getElementById('epBirth').value;s.cpf=document.getElementById('epCpf').value.trim();s.height=Number(document.getElementById('epHeight').value)||null;s.weight=Number(document.getElementById('epWeight').value)||null;const u=db.users.find(x=>x.id===s.id)||db.users.find(x=>x.email.toLowerCase()===oldEmail.toLowerCase());if(u){u.name=name;u.email=email}db.session.name=name;db.session.email=email;save();audit('Edição do próprio perfil',name);closeModal();start();showPage('perfil');toast('Perfil atualizado com sucesso')}
function studentChangePasswordModal(){openModal('Alterar minha senha',`<p style="color:var(--muted)">A nova senha deve ter pelo menos 6 caracteres.</p><div class="field password-wrap"><label>Senha atual</label><input id="spOld" type="password"><button onclick="togglePassword('spOld',this)">Mostrar</button></div><div class="field password-wrap"><label>Nova senha</label><input id="spNew" type="password"><button onclick="togglePassword('spNew',this)">Mostrar</button></div><div class="field password-wrap"><label>Confirmar nova senha</label><input id="spNew2" type="password"><button onclick="togglePassword('spNew2',this)">Mostrar</button></div><div class="actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="studentChangePassword()">Salvar nova senha</button></div>`)}
function studentChangePassword(){const s=db.students.find(x=>x.id===db.session.id);const u=db.users.find(x=>x.id===s.id)||db.users.find(x=>x.email.toLowerCase()===s.email.toLowerCase());if(!u)return alert('Usuário não encontrado.');const old=document.getElementById('spOld').value,n=document.getElementById('spNew').value,n2=document.getElementById('spNew2').value;if(old!==u.password)return alert('A senha atual está incorreta.');if(!n||n.length<6)return alert('A nova senha deve ter pelo menos 6 caracteres.');if(n===old)return alert('A nova senha deve ser diferente da atual.');if(n!==n2)return alert('As novas senhas não conferem.');u.password=n;s.password=n;save();audit('Alteração de senha do aluno',s.name);closeModal();toast('Senha alterada com sucesso')}
function objetivo(){const s=db.students.find(x=>x.id===db.session.id)||{};return `<div class="page-title"><div><h2>Meu objetivo</h2><p>Objetivo definido no cadastro e acompanhado pelo ROH FIT.</p></div></div><div class="card"><div class="metric"><div class="label">Objetivo atual</div><div class="value">${esc(s.goal||'Ainda não definido')}</div></div></div>`}
function studentWorkouts(){const s=db.students.find(x=>x.id===db.session.id)||db.students[0]||{};const ws=db.workouts.filter(w=>!w.student||w.student===s.name);return `<div class="page-title"><div><h2>Meus treinos</h2><p>Execução com séries, repetições, carga, cronômetro e conclusão.</p></div></div><div class="grid-3">${ws.length?ws.map(w=>`<div class="card"><span class="badge blue">${esc(w.status)}</span><h3>${esc(w.name)}</h3><p style="color:var(--muted)">${esc(w.day)} · ${w.exercises} exercícios</p><button class="btn btn-primary" onclick="startWorkout(${w.id})">Iniciar treino</button></div>`).join(''):'<div class="card"><div class="empty">Nenhum treino atribuído.</div></div>'}</div>`}
function startWorkout(id){const w=db.workouts.find(x=>x.id===id);openModal(w.name,`<div class="notice">Treino iniciado. No aplicativo final, esta tela exibirá vídeo, séries, repetições, carga e cronômetro por exercício.</div><div class="section">${db.exercises.slice(0,Math.min(w.exercises||3,3)).map((e,i)=>`<div class="exercise-line"><div><b>${i+1}. ${esc(e.name)}</b><div style="color:var(--muted)">Séries: 3 · Repetições: 12 · Carga: — · Descanso: 60s</div></div><button class="btn btn-secondary" onclick="playVideo(${db.videos[0]?.id||1})">Vídeo</button></div>`).join('')}</div><div class="actions"><button class="btn btn-primary" onclick="closeModal();toast('Treino finalizado')">Finalizar treino</button></div>`)}
function studentEvolution(){const s=db.students.find(x=>x.id===db.session.id)||{};return `<div class="page-title"><div><h2>Minha evolução</h2><p>Peso, medidas, fotos, cargas, repetições e frequência.</p></div></div><div class="grid"><div class="card metric"><div class="label">Peso atual</div><div class="value">${s.weight?s.weight+' kg':'—'}</div></div><div class="card metric"><div class="label">Cargas</div><div class="value">—</div></div><div class="card metric"><div class="label">Repetições</div><div class="value">—</div></div><div class="card metric"><div class="label">Frequência</div><div class="value">—</div></div></div><div class="section card"><h3>Fotos e medidas</h3><div class="empty">Os registros aparecerão aqui conforme forem adicionados.</div></div>`}
function history(){return `<div class="page-title"><div><h2>Histórico</h2><p>Treinos concluídos e registros do aluno.</p></div></div><div class="card"><div class="empty">Nenhum histórico detalhado registrado no protótipo.</div></div>`}
function plan(){const s=db.students.find(x=>x.id===db.session.id)||{};const p=db.plans.find(x=>x.name===s.plan);return `<div class="page-title"><div><h2>Plano ativo</h2><p>Assinatura atual do aluno.</p></div></div><div class="card">${p?`<span class="badge ok">Ativo</span><h2>${esc(p.name)}</h2><div class="metric"><div class="value">R$ ${Number(p.value).toFixed(2).replace('.',',')}</div></div><p style="color:var(--muted)">${esc(p.period)}</p>`:'<div class="empty">Nenhum plano ativo.</div>'}</div>`}
function studentPayments(){const s=db.students.find(x=>x.id===db.session.id)||{};const ps=db.payments.filter(p=>p.student===s.name);return `<div class="page-title"><div><h2>Meus pagamentos</h2><p>Histórico financeiro do aluno.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Plano</th><th>Valor</th><th>Status</th><th>Data</th></tr></thead><tbody>${ps.length?ps.map(p=>`<tr><td>${esc(p.plan)}</td><td>R$ ${Number(p.value).toFixed(2).replace('.',',')}</td><td><span class="badge ${p.status==='Aprovado'?'ok':'warn'}">${esc(p.status)}</span></td><td>${esc(p.date)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Nenhum pagamento encontrado.</td></tr>'}</tbody></table></div>`}
function filterTable(q,id){q=q.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}function filterStatus(v,id){document.querySelectorAll('#'+id+' tr').forEach(r=>r.style.display=!v||r.textContent.includes(v)?'':'none')}
if(db.session)start();
</script></body></html>
